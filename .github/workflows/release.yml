name: Release

# Push a tag such as v1.0.0 to build the zips and publish them as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
      - name: Test
        working-directory: bridge
        run: go test ./...
      - name: Build soffice.exe
        working-directory: bridge
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o soffice.exe .
      - name: Package
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME}"
          mkdir -p dist/word-pdf-bridge dist/pdfcraft-for-word
          cp bridge/soffice.exe bridge/word-to-pdf.ps1 bridge/install.ps1 bridge/install.cmd bridge/README.txt LICENSE dist/word-pdf-bridge/
          cp "word-addin/PdfCraft for Word.dotm" word-addin/install-word-addin.cmd word-addin/README.txt word-addin/PdfCraftForWord.bas LICENSE dist/pdfcraft-for-word/
          cd dist
          zip -qr "word-pdf-bridge-${v}.zip" word-pdf-bridge
          zip -qr "pdfcraft-for-word-${v}.zip" pdfcraft-for-word
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" --generate-notes
